<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM Курьера - Книжный магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 60px;
        }
        .navbar {
            background-color: #343a40 !important;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 60px;
            bottom: 0;
            width: 200px;
            background-color: #343a40;
            padding-top: 20px;
            z-index: 100;
        }
        .sidebar a {
            color: #adb5bd;
            padding: 10px 20px;
            text-decoration: none;
            display: block;
        }
        .sidebar a:hover, .sidebar a.active {
            color: #fff;
            background-color: #495057;
        }
        .main-content {
            margin-left: 200px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Навигация CRM для курьера -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'courier_orders' %}">🚚 CRM Курьера</a>
            
            <div class="d-flex">
                <span class="navbar-text me-3">
                    Вы вошли как: <strong>{{ user.get_full_name|default:user.username }}</strong>
                    ({{ user.role.get_role_display }})
                </span>
                <a href="{% url 'index' %}" class="btn btn-outline-light btn-sm me-2">
                    🏪 В магазин
                </a>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">
                    🚪 Выйти
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Боковая панель для курьера -->
            <div class="sidebar">
                <a class="{% if request.resolver_match.url_name == 'courier_orders' %}active{% endif %}" 
                   href="{% url 'courier_orders' %}">🚚 Заказы для доставки</a>
            </div>

            <!-- Основной контент -->
            <div class="main-content">
                {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
