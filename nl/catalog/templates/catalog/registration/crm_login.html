<!-- templates/catalog/registration/crm_login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в CRM - Книжный магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,.1);
            padding: 40px;
        }
        
        .login-icon {
            font-size: 64px;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .role-badge {
            font-size: 0.8em;
            padding: 3px 10px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <div class="text-center">
                        <div class="login-icon">📚</div>
                        <h2 class="mb-3">CRM система</h2>
                        <p class="text-muted mb-4">Книжный магазин</p>
                    </div>
                    
                    {% if form.errors %}
                    <div class="alert alert-danger">
                        Неверное имя пользователя или пароль.
                    </div>
                    {% endif %}
                    
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" name="username" class="form-control" 
                                   placeholder="Введите имя пользователя" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" 
                                   placeholder="Введите пароль" required>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Войти в систему
                            </button>
                        </div>
                        
                        <div class="text-center">
                            <a href="{% url 'index' %}" class="text-decoration-none">
                                Вернуться на сайт магазина
                            </a>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    
                    <!-- Тестовые пользователи -->
                    <div class="mt-4">
                        <h6 class="text-center mb-3">Тестовые пользователи:</h6>
                        <div class="row">
                            <div class="col-12 mb-2">
                                <div class="card border-success">
                                    <div class="card-body py-2">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <strong>Сотрудник магазина</strong>
                                                <div class="text-muted small">staff / staff123</div>
                                            </div>
                                            <span class="badge bg-success role-badge">staff</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 mb-2">
                                <div class="card border-primary">
                                    <div class="card-body py-2">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <strong>Курьер</strong>
                                                <div class="text-muted small">courier / courier123</div>
                                            </div>
                                            <span class="badge bg-primary role-badge">courier</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="card border-secondary">
                                    <div class="card-body py-2">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <strong>Покупатель</strong>
                                                <div class="text-muted small">customer / customer123</div>
                                            </div>
                                            <span class="badge bg-secondary role-badge">customer</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
